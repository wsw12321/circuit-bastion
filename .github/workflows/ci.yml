name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies with lockfile
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install dependencies without lockfile
        if: hashFiles('package-lock.json') == ''
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Check JavaScript syntax
        run: npm run check

      - name: Smoke test Node server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/circuit-bastion-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/circuit-bastion.html; then
              grep -q 'CIRCUIT BASTION' /tmp/circuit-bastion.html
              exit 0
            fi
            sleep 0.25
          done

          cat /tmp/circuit-bastion-server.log
          exit 1

  godot-smoke:
    name: Godot headless smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          godot_root="$RUNNER_TEMP/godot"
          mkdir -p "$godot_root"
          curl --fail --retry 3 --location "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" --output "$godot_root/editor.zip"
          unzip -q "$godot_root/editor.zip" -d "$godot_root/editor"
          mv "$godot_root/editor/Godot_v4.3-stable_linux.x86_64" "$godot_root/godot"
          chmod +x "$godot_root/godot"
          echo "GODOT_BIN=$godot_root/godot" >> "$GITHUB_ENV"

      - name: Run Godot smoke checks
        run: |
          "$GODOT_BIN" --headless --path . --script scripts/godot_smoke.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/simulation_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/qa_smoke.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/p1_smoke.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/layout_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/android_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/audio_feedback_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/content_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/platform_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          PERF_BUDGET_MS=5000 "$GODOT_BIN" --headless --path . --script scripts/performance_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/resource_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility


  godot-windows-smoke:
    name: Godot native smoke (Windows)
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          godot_root="$RUNNER_TEMP/godot"
          mkdir -p "$godot_root"
          curl --fail --retry 3 --location \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" \
            --output "$godot_root/editor.zip"
          unzip -q "$godot_root/editor.zip" -d "$godot_root/editor"
          godot_bin="$godot_root/editor/Godot_v4.3-stable_win64.exe"
          test -f "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Run native Windows smoke checks
        shell: bash
        env:
          PERF_BUDGET_MS: '10000'
        run: |
          "$GODOT_BIN" --headless --path . --script scripts/godot_smoke.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/simulation_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/qa_smoke.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/content_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/platform_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/performance_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/resource_probe.gd --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
