name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable Node package
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: circuit-bastion-portable
          path: dist/circuit-bastion-${{ github.ref_name }}.zip
          if-no-files-found: error

  godot-required:
    name: Godot desktop exports (Linux x64 + Windows x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Godot editor and export templates
        shell: bash
        env:
          GODOT_VERSION: 4.3
          GODOT_RELEASE: 4.3-stable
        run: |
          set -euo pipefail
          godot_root="$RUNNER_TEMP/godot"
          template_root="$HOME/.local/share/godot/export_templates"
          mkdir -p "$godot_root" "$template_root"
          curl --fail --retry 3 --location \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$godot_root/editor.zip"
          unzip -q "$godot_root/editor.zip" -d "$godot_root/editor"
          mv "$godot_root/editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$godot_root/godot"
          chmod +x "$godot_root/godot"
          curl --fail --retry 3 --location \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$godot_root/templates.tpz"
          unzip -q "$godot_root/templates.tpz" -d "$godot_root/templates"
          template_source="$(find "$godot_root/templates" -type f -name 'linux_release.x86_64' -printf '%h\n' | while IFS= read -r candidate; do
            if [[ -f "$candidate/windows_release_x86_64.exe" ]]; then
              printf '%s\n' "$candidate"
              break
            fi
          done)"
          if [[ -z "$template_source" || ! -d "$template_source" ]]; then
            echo "Godot export template directory was not found after extraction" >&2
            find "$godot_root/templates" -maxdepth 4 -print >&2
            exit 1
          fi
          template_version="${GODOT_VERSION}.stable"
          if [[ -f "$template_source/version.txt" ]]; then
            version_from_file="$(tr -d '\r\n' < "$template_source/version.txt")"
            if [[ "$version_from_file" =~ ^[0-9]+\.[0-9]+\.stable$ ]]; then
              template_version="$version_from_file"
            fi
          fi
          template_destination="$template_root/$template_version"
          mkdir -p "$template_destination"
          cp -R "$template_source/." "$template_destination/"
          test -f "$template_destination/linux_release.x86_64"
          test -f "$template_destination/windows_release_x86_64.exe"
          echo "GODOT_BIN=$godot_root/godot" >> "$GITHUB_ENV"

      - name: Run Godot headless smoke checks
        run: |
          "$GODOT_BIN" --headless --path . --script scripts/godot_smoke.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/simulation_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/qa_smoke.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/p1_smoke.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/layout_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/android_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/content_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/platform_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          PERF_BUDGET_MS=5000 "$GODOT_BIN" --headless --path . --script scripts/performance_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility
          "$GODOT_BIN" --headless --path . --script scripts/resource_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility

      - name: Export Linux x64 Godot build
        run: bash scripts/package-godot-release.sh "Linux/X11" "circuit-bastion-godot-linux-x64" "$GITHUB_REF_NAME"

      - name: Export Windows x64 Godot build
        run: bash scripts/package-godot-release.sh "Windows Desktop" "circuit-bastion-godot-windows-x64" "$GITHUB_REF_NAME"

      - name: Upload Godot packages
        uses: actions/upload-artifact@v4
        with:
          name: circuit-bastion-godot
          path: dist/godot/*.zip
          if-no-files-found: error

  android-required:
    name: Godot Android arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          yes | sdkmanager --licenses >/dev/null || true
          for required_path in \
            "cmdline-tools" \
            "platform-tools" \
            "platforms/android-34" \
            "build-tools/34.0.0" \
            "cmake/3.10.2.4988404" \
            "ndk/23.2.8568313"; do
            test -d "$ANDROID_SDK_ROOT/$required_path"
          done

      - name: Validate Android release YAML contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "uses: android-actions/setup-android@v4" .github/workflows/release.yml
          grep -Fq "packages: ''" .github/workflows/release.yml
          if grep -Eq "([[:space:]]|^)tools([[:space:]]|$)" .github/workflows/release.yml; then
            echo "obsolete Android SDK package requested" >&2
            exit 1
          fi

      - name: Install pinned Godot editor and Android export templates
        shell: bash
        env:
          GODOT_VERSION: 4.3
          GODOT_RELEASE: 4.3-stable
        run: |
          set -euo pipefail
          godot_root="$RUNNER_TEMP/godot"
          template_root="$HOME/.local/share/godot/export_templates"
          mkdir -p "$godot_root" "$template_root"
          curl --fail --retry 3 --location \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$godot_root/editor.zip"
          unzip -q "$godot_root/editor.zip" -d "$godot_root/editor"
          mv "$godot_root/editor/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$godot_root/godot"
          chmod +x "$godot_root/godot"
          curl --fail --retry 3 --location \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$godot_root/templates.tpz"
          unzip -q "$godot_root/templates.tpz" -d "$godot_root/templates"
          template_source="$(find "$godot_root/templates" -type f -name 'android_debug.apk' -printf '%h\n' | head -n 1)"
          test -n "$template_source"
          template_destination="$template_root/${GODOT_VERSION}.stable"
          mkdir -p "$template_destination"
          cp -R "$template_source/." "$template_destination/"
          test -f "$template_destination/android_debug.apk"
          echo "GODOT_BIN=$godot_root/godot" >> "$GITHUB_ENV"

      - name: Generate standard debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android contract probe
        env:
          CIRCUIT_BASTION_ANDROID_SDK_PROBE: '1'
        run: |
          "$GODOT_BIN" --headless --path . --script scripts/android_probe.gd \
            --display-driver headless --audio-driver Dummy --rendering-method gl_compatibility

      - name: Export Android arm64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p dist/godot
          "$GODOT_BIN" --headless --path . --export-debug "Android" \
            dist/godot/circuit-bastion-android-arm64.apk
          test -s dist/godot/circuit-bastion-android-arm64.apk
          unzip -tq dist/godot/circuit-bastion-android-arm64.apk >/dev/null
          test "$(stat -c %s dist/godot/circuit-bastion-android-arm64.apk)" -le 104857600

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: circuit-bastion-godot-android-arm64
          path: dist/godot/circuit-bastion-android-arm64.apk
          if-no-files-found: error

  sea-required:
    name: SEA ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            executable: circuit-bastion-linux-x64
          - os: windows-2022
            platform: windows
            arch: x64
            executable: circuit-bastion-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install SEA tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build SEA executable
        env:
          SEA_NAME: circuit-bastion-${{ matrix.platform }}-${{ matrix.arch }}
          SEA_OUTPUT_DIR: dist/sea
        run: npm run build:sea

      - name: Smoke test SEA executable
        run: node scripts/smoke-sea.mjs "dist/sea/${{ matrix.executable }}"

      - name: Upload SEA executable
        uses: actions/upload-artifact@v4
        with:
          name: circuit-bastion-sea-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/sea/${{ matrix.executable }}
          if-no-files-found: error

  publish:
    needs: [portable, godot-required, android-required, sea-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download portable package
        uses: actions/download-artifact@v4
        with:
          name: circuit-bastion-portable
          path: release-assets/circuit-bastion-portable

      - name: Download Linux SEA executable
        uses: actions/download-artifact@v4
        with:
          name: circuit-bastion-sea-linux-x64
          path: release-assets/circuit-bastion-sea-linux-x64

      - name: Download Windows SEA executable
        uses: actions/download-artifact@v4
        with:
          name: circuit-bastion-sea-windows-x64
          path: release-assets/circuit-bastion-sea-windows-x64

      - name: Download Godot desktop packages
        uses: actions/download-artifact@v4
        with:
          name: circuit-bastion-godot
          path: release-assets/circuit-bastion-godot

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: circuit-bastion-godot-android-arm64
          path: release-assets/circuit-bastion-godot-android-arm64

      - name: Assemble platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          cp release-assets/circuit-bastion-portable/*.zip release-dist/
          cp release-assets/circuit-bastion-godot/*.zip release-dist/
          cp release-assets/circuit-bastion-godot-android-arm64/*.apk release-dist/

          for artifact_dir in release-assets/circuit-bastion-sea-*; do
            executable=$(find "$artifact_dir" -maxdepth 1 -type f -print -quit)
            artifact_name=$(basename "$artifact_dir")
            platform_arch=${artifact_name#circuit-bastion-sea-}
            package_name="circuit-bastion-${platform_arch}"
            package_dir="release-dist/${package_name}"
            mkdir -p "$package_dir"
            cp "$executable" "$package_dir/"
            cp README.md RUNNING.md "$package_dir/"
            chmod +x "$package_dir/$(basename "$executable")" 2>/dev/null || true
            (
              cd release-dist
              zip -qr "${package_name}.zip" "$package_name"
            )
          done

      - name: Validate release artifacts and write checksums
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-release-assets.sh release-dist
          (
            cd release-dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          )

      - name: Create GitHub Release and upload archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-dist/*.zip release-dist/*.apk release-dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-dist/*.zip release-dist/*.apk release-dist/SHA256SUMS.txt \
              --title "Circuit Bastion ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

