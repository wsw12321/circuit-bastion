name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable release package
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="dist/circuit-bastion-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --title "Circuit Bastion ${GITHUB_REF_NAME}" \
            --generate-notes
